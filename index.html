<!DOCTYPE html>
<html lang="pt-BR">

            background: white;
            padding: 20px;
            border-radius: 12px;

            margin: 0;
        }

            margin-bottom: 20px;
            border: 1px solid #c8e6c9;
        }

            text-align: center;
            font-weight: bold;
